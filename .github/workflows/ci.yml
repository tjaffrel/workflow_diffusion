name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install dependencies
        run: pixi install

      - name: Verify imports
        run: pixi run test-imports

      # PyTorch from conda-forge segfaults on macOS ARM CI runners.
      # Run full suite on Linux/Windows, skip PyTorch/TF tests on macOS.
      - name: Run tests (full)
        if: runner.os != 'macOS'
        run: pixi run test

      - name: Run tests (skip PyTorch/TF on macOS)
        if: runner.os == 'macOS'
        run: pixi run pytest tests/ -v --ignore=tests/test_diffusion

  cuda-build-check:
    runs-on: ubuntu-latest
    # GitHub runners have no GPU, so mock the __cuda virtual package to let the
    # cuda env install. This does NOT fake a CUDA build — torch.version.cuda
    # below still proves a real GPU build was selected.
    env:
      CONDA_OVERRIDE_CUDA: "12.6"
    steps:
      - uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.1

      - name: Install the cuda environment
        run: pixi install -e cuda

      - name: Assert PyTorch is a CUDA build (no GPU required)
        run: |
          pixi run -e cuda python -c "import torch; assert torch.version.cuda is not None, f'CPU build leaked into cuda env (torch.version.cuda={torch.version.cuda})'; print('cuda build OK:', torch.__version__, torch.version.cuda)"

      - name: Assert the lockfile carries a cuda build
        run: |
          grep -Eq 'pytorch(-gpu)?-[0-9].*cuda' pixi.lock && echo "lock contains a cuda build" || { echo "ERROR: no cuda build found in pixi.lock"; exit 1; }
