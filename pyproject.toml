[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mofgen"
description = "MOF Generation workflow with diffusion models and AI agents"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MOFGen Team"},
]
# torchvision/torchaudio are intentionally omitted — never imported by mofgen.
dependencies = [
    "torch>=2.0.0",
    "tensorflow>=2.15.0",
    "einops>=0.6.0",
    "absl-py>=1.4.0",
    "fire>=0.5.0",
    "matplotlib>=3.7.0",
    "imageio>=2.25.0",
    "tqdm>=4.65.0",
    "pymatgen>=2023.12.18",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
agents = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
]
mcp = [
    "mcp>=1.0.0",
    "mofgen[agents,data]",
]
data = [
    "emmet-core>=0.86.3",
    "pyarrow>=14.0.0",
    "s3fs>=2023.12.0",
    "boto3>=1.34.0",
    "ase>=3.22.0",
    "mp-api>=0.41.0",
    "mpcontribs-client>=5.0.0",
]
qforge = [
    "jobflow>=0.1.0",
    "atomate2>=0.0.14",
    "fireworks>=2.0.0",
    "mofgen[agents]",
]
vis = [
    "seaborn>=0.12.0",
    "pymongo>=4.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.12.0",
]
all = [
    "mofgen[agents,mcp,data,qforge,vis,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["diffuse_materials", "agents", "mofgen_tools", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
