[workspace]
name = "mofgen"
description = "MOF Generation workflow with diffusion models and AI agents"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pymatgen = "*"
matplotlib = "*"
imageio = "*"
tqdm = "*"
einops = "*"
absl-py = "*"
fire = "*"
pandas = "*"
pytest = "*"
pytest-mock = "*"

[pypi-dependencies]
mofgen = { path = ".", editable = true }
tensorflow = ">=2.15,<3"
python-dotenv = "*"
seaborn = "*"
pymongo = "*"
mp-api = "*"
mpcontribs-client = "*"
openai = "*"
jobflow = "*"
atomate2 = {version = "*", extras = ["forcefields"]}
fireworks = "*"
langchain = "*"
langchain-openai = "*"
anthropic = "*"
mcp = "*"
ase = "*"
ember-ai = "*"
emmet-core = ">=0.86.3"
pyarrow = "*"
s3fs = "*"
boto3 = "*"

# CPU environment: force the CPU build on Linux/Windows; macOS uses MPS natively.
# torchvision/torchaudio are intentionally omitted — never imported by mofgen.
[feature.cpu.target.linux-64.dependencies]
pytorch-cpu = ">=2.5.1,<2.6"

[feature.cpu.target.win-64.dependencies]
pytorch-cpu = ">=2.5.1,<2.6"

[feature.cpu.target.osx-arm64.dependencies]
pytorch = ">=2.5.1,<2.6"

# CUDA environment: conda-forge GPU build, CUDA auto-detected from the driver.
# linux-64 only — conda-forge ships no CUDA PyTorch for Windows (see README fallback).
[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.system-requirements]
cuda = "12"

[feature.cuda.dependencies]
pytorch-gpu = ">=2.5.1,<2.6"

[environments]
default = {features = ["cpu"], solve-group = "default"}
cuda = {features = ["cuda"], solve-group = "cuda"}

[tasks]
test = "pytest tests/ -v"
test-imports = "python scripts/test_imports.py"
train = "python diffuse_materials/train.py --dataset_dir sample_data"
convert = "python diffuse_materials/cif_to_tfrecord.py --cif_dir /path/to/cifs --output /path/to/output.tfrecord"
check-cuda = "python -c \"import torch; print(f'PyTorch version: {torch.__version__}'); print(f'CUDA available: {torch.cuda.is_available()}'); print(f'CUDA version: {torch.version.cuda}'); print(f'Device count: {torch.cuda.device_count()}')\""
check-tf = "python -c \"import tensorflow as tf; print(f'TensorFlow version: {tf.__version__}')\""
doctor = "python scripts/doctor.py"
mp-download = "python scripts/mp_data_extraction.py download"
mp-query = "python scripts/mp_data_extraction.py query"
extract-trajectories = "python examples/extract_trajectories.py"
mcp-server = "python -m mofgen_tools"
